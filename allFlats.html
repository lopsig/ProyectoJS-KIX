<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Flats</title>
  <link rel="stylesheet" href="src/allFlats.css">
</head>

<body>

  <header>
    <div class="logo">
      <span id="app-name"> RentEase</span>
      <img src="assets/logo.png" alt="Logo de la compañía">
    </div>
    <div class="user-info">
      <span id="user-greeting"></span>
      <button id="logout-button">Log out</button>
    </div>
    <nav>
      <ul>
        <!-- <li><a href="home.html">Home</a></li> -->
        <li><a href="home.html">Home</a></li>
        <!-- <li><a href="allFlats.html">All Flats</a></li> -->
        <li><a href="newFlat.html">New Flat</a></li>
        <li><a href="updateProfile.html">Update Profile</a></li>
      </ul>
    </nav>
  </header>

  <h1>All Flats</h1>


  <!-- Filtros -->
  <div class="filters">
    <label for="city">Ciudad:</label>
    <input type="text" id="city" placeholder="Filtrar por ciudad">

    <label for="price-range">Precio:</label>
    <input type="number" id="min-price" placeholder="Mínimo">
    <input type="number" id="max-price" placeholder="Máximo">

    <label for="area-range">Área:</label>
    <input type="number" id="min-area" placeholder="Mínimo">
    <input type="number" id="max-area" placeholder="Máximo">

    <button id="filter-button">Filtrar</button>
  </div>

  <!-- Botones de ordenamiento -->
  <div class="sort-options">
    <button id="sort-city">Ordenar por Ciudad</button>
    <button id="sort-price">Ordenar por Precio</button>
    <button id="sort-area">Ordenar por Tamaño</button>
  </div>

  <!-- Tabla de flats -->
  <table id="flats-table">
    <thead>
      <tr>

      </tr>
    </thead>
    <tbody>
      <!-- Los datos se cargarán dinámicamente con JavaScript -->
    </tbody>
  </table>

  <!-- Modal para mostrar imágenes -->
  <div id="image-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">X</span>
      <div id="modal-images"></div>
    </div>
  </div>



  <script src="src/allFlats.js"></script>
</body>

</html>
