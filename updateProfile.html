<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Update</title>
  <link rel="stylesheet" href="src/styleRegProf.css">
</head>

<body>
  <div class="container">
    <h2>Profile Update</h2>
    <form id="updateForm">
      <input type="text" id="editFirstName" placeholder="" required autocomplete="off">
      <input type="text" id="editLastName" placeholder="Last Name" required autocomplete="off">
      <input type="date" id="editBirthDate" required>
      <input type="password" id="password" placeholder="Nueva Contraseña" autocomplete="off">
      <input type="password" id="confirmPassword" placeholder="Confirmar Nueva Contraseña" required autocomplete="off">
      <button type="submit">Update</button>
    </form>
    <p id="error" class="error"></p>
    <ul class="validation-list">
      <li id="length">Contraseña debe tener al menos 6 caracteres</li>
      <li id="letter">Contraseña debe tener letras</li>
      <li id="number">Contraseña debe tener al menos un número</li>
      <li id="special">Contraseña debe tener al menos un carácter especial (!@#$%^&*.)</li>
    </ul>
  </div>
  <script type="module" src="src/updateProfile.js"></script>
</body>

</html>
